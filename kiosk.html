<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>リノア タイムカード（店舗端末）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
:root{
  --bg:#F4F6F4; --panel:#FFFFFF; --ink:#22302E; --muted:#6C7A77; --line:#DCE3DF; --line2:#EEF2EF;
  --accent:#1F6F6B; --accent-ink:#165754; --accent-soft:#DDEEEC; --accent-tint:#EEF6F5;
  --warn:#B5651D; --warn-soft:#FBEBDD; --ok:#2F7D4E; --ok-soft:#E1F1E6; --ng:#B93F3F; --ng-soft:#F8E3E3; --chip:#E6ECE9;
  --shadow:0 10px 36px rgba(30,60,55,.14);
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-disp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#171D1C; --panel:#212928; --ink:#ECF1EF; --muted:#9BABA7; --line:#36423F; --line2:#2B3533;
  --accent:#5FB8B2; --accent-ink:#8ED3CE; --accent-soft:#234644; --accent-tint:#1D3331;
  --warn:#E0A05E; --warn-soft:#44321E; --ok:#7CC79A; --ok-soft:#1F3B2A; --ng:#EF8585; --ng-soft:#46262A; --chip:#2F3B39;
  --shadow:0 10px 36px rgba(0,0,0,.45); color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased;user-select:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
button,input{font:inherit;color:inherit}
h1,h2{margin:0;font-family:var(--f-disp);font-weight:700}
.wrap{max-width:1100px;margin:0 auto;padding:18px max(20px,env(safe-area-inset-right,0px)) 30px max(20px,env(safe-area-inset-left,0px));min-height:100%;display:flex;flex-direction:column;gap:16px}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.brand .eyebrow{font-size:12px;letter-spacing:.2em;color:var(--accent);font-weight:700;text-transform:uppercase}
.brand h1{font-size:26px;letter-spacing:.04em}
.brand .sub{font-size:14px;color:var(--muted)}
.clock{text-align:right}
.clock .t{font-family:var(--f-disp);font-size:64px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock .d{font-size:16px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:118px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.st:active{transform:scale(.985)}
.st .nm{font-family:var(--f-disp);font-size:24px;font-weight:700;line-height:1.2}
.st .sc{font-size:13px;color:var(--muted)}
.st .pill{align-self:flex-start;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--muted)}
.st.in{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.st.in .pill{background:var(--ok-soft);color:var(--ok)}
.st.done .pill{background:var(--accent-soft);color:var(--accent-ink)}
.st.nopin .pill{background:var(--warn-soft);color:var(--warn)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.foot a{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.card h2{font-size:20px;margin-bottom:6px}
.note{font-size:14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:999px;padding:12px 24px;font-weight:700;cursor:pointer;min-height:52px;font-size:18px}
.btn.ghost{background:transparent;color:var(--accent-ink);border-color:var(--line)}
.btn.big{min-height:84px;font-size:28px;letter-spacing:.14em;border-radius:20px;width:100%}
.btn.out{background:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.setup input{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:24px;letter-spacing:.12em;text-transform:uppercase;background:var(--bg);min-height:60px;text-align:center;font-family:ui-monospace,Menlo,monospace}
.err{color:var(--ng);font-size:15px;min-height:1.4em}
/* モーダル */
.ov{position:fixed;inset:0;background:rgba(10,20,18,.5);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.md{background:var(--panel);border-radius:22px;box-shadow:var(--shadow);width:100%;max-width:560px;padding:24px;display:flex;flex-direction:column;gap:14px}
.md .who{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.md .who b{font-family:var(--f-disp);font-size:30px}
.md .who span{font-size:14px;color:var(--muted)}
.pinbox{display:flex;justify-content:center;gap:14px;margin:4px 0}
.pinbox i{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);display:inline-block}
.pinbox i.on{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{border:1px solid var(--line);background:var(--bg);border-radius:14px;min-height:64px;font-size:26px;font-weight:700;cursor:pointer}
.pad button.fn{font-size:16px;font-weight:500;color:var(--muted)}
.pad button:active{background:var(--accent-soft)}
.brk{display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px}
.brk input{width:90px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);text-align:center;font-size:20px;min-height:48px}
.md .row{display:flex;gap:10px}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:22px 34px;border-radius:20px;font-size:26px;font-family:var(--f-disp);font-weight:700;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;text-align:center;max-width:90vw}
.toast.on{opacity:1}
.toast.ok{background:var(--ok)}.toast.ng{background:var(--ng)}
.toast small{display:block;font-size:15px;font-weight:400;opacity:.9;margin-top:4px}
@media (max-width:600px){.clock .t{font-size:44px}.brand h1{font-size:20px}.grid{grid-template-columns:repeat(2,1fr)}.st .nm{font-size:20px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card"><h2>読み込み中…</h2></div></div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   ★ 設定：index.html と同じ Apps Script の URL
   ============================================================ */
const CONFIG = { apiUrl: "https://script.google.com/macros/s/AKfycbzhQBkdaln_Rsxx_GCO5MnYtuQq0N1VmV7wZz_CaP-AhtT_Z5LhJJZyknqsc39sRpw/exec" };
const KEY_LS = "rinoa-kiosk-key";
const WD = ["日","月","火","水","木","金","土"];
const pad = n => String(n).padStart(2,"0");
const dropZero = hm => String(hm||"").replace(/^0/,"");
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let toastT; function toast(msg,cls,sub){ const t=$("#toast"); t.className="toast on "+(cls||""); t.innerHTML=esc(msg)+(sub?`<small>${esc(sub)}</small>`:""); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),3200); }

const S = { key:null, data:null, error:null, modal:null, pin:"", busy:false, lastFetch:0 };
try{ S.key=localStorage.getItem(KEY_LS)||null; }catch(e){}

async function api(action,data,key){
  const res=await fetch(CONFIG.apiUrl,{method:"POST",body:JSON.stringify({action,deviceKey:key||S.key,data:data||{}})});
  const j=await res.json().catch(()=>({ok:false,error:"bad_response"}));
  if(!j.ok) throw new Error(j.error||"error");
  return j;
}
const ERR={undo_expired:"取り消せるのは打刻から15分以内です",not_out:"退勤はまだ押されていません",already_out:"退勤済みのため出勤は取り消せません",bad_device:"端末コードが違うか、無効になっています",pin_not_set:"暗証番号が未設定です。自分のLINEのアプリ「タイムカード」で設定してください",bad_pin:"暗証番号が違います",already_in:"すでに出勤しています",not_in:"出勤が押されていません",bad_response:"通信に失敗しました"};
const errMsg=e=>ERR[String(e&&e.message||e)]||("エラー："+String(e&&e.message||e));

async function load(){
  if(!S.key){ S.data=null; render(); return; }
  try{ S.data=await api("kioskBootstrap",{}); S.error=null; S.lastFetch=Date.now(); }
  catch(e){ if(String(e.message)==="bad_device"){ S.key=null; try{localStorage.removeItem(KEY_LS);}catch(x){} S.error="端末コードが無効になりました。もう一度入力してください。"; } else S.error=errMsg(e); }
  render();
}
function schedText(cell){
  if(!cell) return ""; const base=String(cell).split("|")[0]; const st=S.data.settings;
  if(base==="OFF") return "本日は休みの予定";
  if(base.startsWith("C:")){ const [a,b]=base.slice(2).split("-"); return `予定 ${dropZero(a)}〜${dropZero(b)}`; }
  return `予定 ${dropZero(st.openStart)}〜${dropZero(st.openEnd)}`;
}
function render(){
  const now=new Date();
  if(!S.key||!S.data){
    app.innerHTML=`<div class="card setup" style="max-width:560px;margin:8vh auto 0;width:100%">
      <h2>店舗端末の登録</h2><p class="note">経営者が管理画面の「設定」→「店舗端末（iPad）」で発行した<b>端末コード</b>を入れてください。この端末は打刻専用になり、LINEや管理画面にはつながりません。</p>
      <form id="setup" style="display:flex;flex-direction:column;gap:12px;margin-top:10px"><input id="key" placeholder="RINOA-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false"><div class="err" id="err">${esc(S.error||"")}</div><button class="btn" ${S.busy?"disabled":""}>この端末を登録する</button></form>
    </div>`;
    $("#setup").onsubmit=async e=>{ e.preventDefault(); const k=$("#key").value.trim().toUpperCase(); if(!k) return; S.busy=true; render(); try{ await api("kioskBootstrap",{},k); S.key=k; try{localStorage.setItem(KEY_LS,k);}catch(x){} S.error=null; await load(); }catch(err){ S.error=errMsg(err); } S.busy=false; render(); };
    return;
  }
  const D=S.data, st=D.today.status;
  const cards=D.staff.map(s=>{ const x=st[s.id]||{}; const cls= x.out?"done": x.in?"in": (D.settings.kioskPin&&!s.hasPin?"nopin":"");
    const pill= x.out?`退勤済 ${dropZero(x.in)}〜${dropZero(x.out)}`: x.in?`出勤中 ${dropZero(x.in)}〜`: (D.settings.kioskPin&&!s.hasPin?"暗証番号 未設定":"未出勤");
    return `<button class="st ${cls}" data-id="${esc(s.id)}"><span class="nm">${esc(s.name)}</span><span class="pill">${esc(pill)}</span><span class="sc">${esc(schedText(x.sched))}</span></button>`; }).join("");
  app.innerHTML=`<header class="hdr"><div class="brand"><div class="eyebrow">${esc(D.settings.eyebrow||"TIME CARD")}</div><h1>${esc(D.settings.name)}　タイムカード</h1><div class="sub">自分の名前をタップ → 暗証番号 → 出勤／退勤</div></div>
    <div class="clock"><div class="t" id="clk">${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}</div><div class="d">${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${WD[now.getDay()]}）</div></div></header>
    <div class="grid">${cards||'<div class="note">スタッフが登録されていません。各自のLINEから名前を登録してもらってください。</div>'}</div>
    <div class="legend"><span><i style="background:var(--ok)"></i>出勤中</span><span><i style="background:var(--accent-soft)"></i>退勤済み</span><span><i style="background:var(--warn-soft)"></i>暗証番号が未設定（本人のLINEで設定）</span></div>
    <footer class="foot"><span>端末：${esc(D.device.name)}　／　${D.settings.tcUnit}分刻みで計算</span><span><a href="#" id="refresh">再読み込み</a>　|　<a href="#" id="unlink">この端末の登録を解除</a></span></footer>
    ${S.modal?renderModal():""}`;
  document.querySelectorAll(".st").forEach(b=>b.onclick=()=>openModal(b.dataset.id));
  $("#refresh").onclick=e=>{e.preventDefault(); load();};
  $("#unlink").onclick=e=>{ e.preventDefault(); if(e.target.dataset.sure!=="1"){ e.target.dataset.sure="1"; e.target.textContent="本当に解除する（もう一度タップ）"; return; } S.key=null; try{localStorage.removeItem(KEY_LS);}catch(x){} S.data=null; render(); };
  if(S.modal) bindModal();
}
let idleT;
function openModal(id){ S.modal={id}; S.pin=""; render(); clearTimeout(idleT); idleT=setTimeout(()=>{ S.modal=null; render(); },45000); }
function renderModal(){
  const D=S.data, s=D.staff.find(x=>x.id===S.modal.id); if(!s) return "";
  const x=D.today.status[s.id]||{}; const needPin=D.settings.kioskPin; const mode= x.out?"done": x.in?"out":"in";
  const pinUI = needPin?`<div class="pinbox">${[0,1,2,3,4,5].map(i=>`<i class="${i<S.pin.length?"on":""}"></i>`).join("")}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join("")}<button type="button" class="fn" data-k="C">クリア</button><button type="button" data-k="0">0</button><button type="button" class="fn" data-k="B">←</button></div>`:"";
  const minsAgo=hm=>{ if(!hm) return 1e9; const [h,mi]=hm.split(":").map(Number); const n=new Date(); return (n.getHours()*60+n.getMinutes())-(h*60+mi); };
  const undo = (mode==="out"&&minsAgo(x.in)<=15)?`<button class="btn ghost" id="undo" data-type="undoIn" style="width:100%">出勤を取り消す（押し間違い・${minsAgo(x.in)}分前）</button>`
             : (mode==="done"&&minsAgo(x.out)<=15)?`<button class="btn ghost" id="undo" data-type="undoOut" style="width:100%">退勤を取り消す（押し間違い・${minsAgo(x.out)}分前）</button>`:"";
  const action = mode==="done"?`<div class="note" style="text-align:center">本日は退勤済みです（${dropZero(x.in)}〜${dropZero(x.out)}）。${undo?"押し間違いなら暗証番号を入れて取り消せます。":"修正は経営者に伝えてください。"}</div>${undo}`
    : mode==="out"?`<div class="brk">休憩 <input type="number" id="brk" value="0" min="0" max="300" step="5" inputmode="numeric"> 分</div><button class="btn big out" id="go" ${S.busy?"disabled":""}>退　勤</button>${undo}`
    : `<button class="btn big" id="go" ${S.busy?"disabled":""}>出　勤</button>`;
  return `<div class="ov" id="ov"><div class="md">
    <div class="who"><b>${esc(s.name)} さん</b><span>${x.in?`出勤 ${dropZero(x.in)}`:"未出勤"}${x.sched?"　"+esc(schedText(x.sched)):""}</span></div>
    ${mode!=="done"&&needPin?`<div class="note" style="text-align:center">${s.hasPin?"暗証番号を入力してください":"暗証番号が未設定です。自分のLINEのアプリ「タイムカード」で設定してから押してください"}</div>`:""}
    ${(mode!=="done"||undo)?pinUI:""}
    ${action}
    <div class="row"><button class="btn ghost" id="cancel" style="flex:1">閉じる</button></div>
  </div></div>`;
}
function bindModal(){
  $("#cancel").onclick=()=>{ S.modal=null; render(); };
  $("#ov").onclick=e=>{ if(e.target.id==="ov"){ S.modal=null; render(); } };
  document.querySelectorAll(".pad button").forEach(b=>b.onclick=()=>{ const k=b.dataset.k; if(k==="C") S.pin=""; else if(k==="B") S.pin=S.pin.slice(0,-1); else if(S.pin.length<6) S.pin+=k; clearTimeout(idleT); idleT=setTimeout(()=>{S.modal=null;render();},45000); document.querySelectorAll(".pinbox i").forEach((el,i)=>el.classList.toggle("on",i<S.pin.length)); });
  const doPunch=async(type,btn)=>{
    const D=S.data, s=D.staff.find(x=>x.id===S.modal.id);
    if(D.settings.kioskPin && S.pin.length<4){ toast("暗証番号を入力してください","ng"); return; }
    S.busy=true; btn.disabled=true;
    try{ const r=await api("kioskPunch",{staffId:s.id,type,pin:S.pin,brk:+($("#brk")?.value||0)}); S.data.today=r.today;
      const day=String(new Date().getDate()), rec=(r.timecard&&r.timecard.days||{})[day]; const st=S.data.today.status[s.id]||{};
      if(rec) S.data.today.status[s.id]={...st,in:rec.in?rec.in.slice(11,16):"",out:rec.out?rec.out.slice(11,16):"",brk:+rec.brk||0};
      else if(type==="undoIn") S.data.today.status[s.id]={...st,in:"",out:"",brk:0};
      setTimeout(load,3000); S.modal=null; S.pin="";
      toast(type==="undoIn"?`${s.name} さん　出勤を取り消しました`:type==="undoOut"?`${s.name} さん　退勤を取り消しました`:`${s.name} さん　${type==="in"?"出勤":"退勤"}しました`,"ok",type.startsWith("undo")?"修正として記録しました":`${dropZero(r.serverTime.slice(11))}　${type==="in"?"いってらっしゃい":"お疲れさまでした"}`); }
    catch(e){ toast(errMsg(e),"ng"); S.pin=""; }
    S.busy=false; render();
  };
  const un=$("#undo"); if(un) un.onclick=()=>doPunch(un.dataset.type,un);
  const go=$("#go"); if(go) go.onclick=async()=>{
    const D=S.data, s=D.staff.find(x=>x.id===S.modal.id), x=D.today.status[s.id]||{}, type=x.in?"out":"in";
    await doPunch(type,go);
  };
}
setInterval(()=>{ const el=$("#clk"); if(el){ const n=new Date(); el.textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`; } },1000);
setInterval(()=>{ if(S.key && !S.modal && Date.now()-S.lastFetch>60000) load(); },15000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && S.key) load(); });
load();
</script>
</body>
</html>
