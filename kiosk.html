<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>リノア タイムカード（店舗端末）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
:root{
  --bg:#F4F6F4; --panel:#FFFFFF; --ink:#22302E; --muted:#6C7A77; --line:#DCE3DF; --line2:#EEF2EF;
  --accent:#1F6F6B; --accent-ink:#165754; --accent-soft:#DDEEEC; --accent-tint:#EEF6F5;
  --warn:#B5651D; --warn-soft:#FBEBDD; --ok:#2F7D4E; --ok-soft:#E1F1E6; --ng:#B93F3F; --ng-soft:#F8E3E3; --chip:#E6ECE9;
  --shadow:0 10px 36px rgba(30,60,55,.14);
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-disp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#171D1C; --panel:#212928; --ink:#ECF1EF; --muted:#9BABA7; --line:#36423F; --line2:#2B3533;
  --accent:#5FB8B2; --accent-ink:#8ED3CE; --accent-soft:#234644; --accent-tint:#1D3331;
  --warn:#E0A05E; --warn-soft:#44321E; --ok:#7CC79A; --ok-soft:#1F3B2A; --ng:#EF8585; --ng-soft:#46262A; --chip:#2F3B39;
  --shadow:0 10px 36px rgba(0,0,0,.45); color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased;user-select:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
button,input{font:inherit;color:inherit}
h1,h2{margin:0;font-family:var(--f-disp);font-weight:700}
.wrap{max-width:1100px;margin:0 auto;padding:18px max(20px,env(safe-area-inset-right,0px)) 30px max(20px,env(safe-area-inset-left,0px));min-height:100%;display:flex;flex-direction:column;gap:16px}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.brand .eyebrow{font-size:12px;letter-spacing:.2em;color:var(--accent);font-weight:700;text-transform:uppercase}
.brand h1{font-size:26px;letter-spacing:.04em}
.brand .sub{font-size:14px;color:var(--muted)}
.clock{text-align:right}
.clock .t{font-family:var(--f-disp);font-size:64px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock .d{font-size:16px;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:10px 22px;font-size:18px;cursor:pointer;min-height:48px}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.mnav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mnav button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 18px;cursor:pointer;min-height:44px;font-size:18px}
.mnav .m{font-family:var(--f-disp);font-size:24px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{text-align:center;font-size:14px;color:var(--muted);padding:2px 0}
.cal .dh.sat{color:#3568B5}.cal .dh.sun{color:#C64B3C}
.cal .d{min-height:96px;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--panel);display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;min-width:0}
.cal .d.empty{border-color:transparent;background:transparent;cursor:default}
.cal .d .top{display:flex;justify-content:space-between;align-items:center}
.cal .d .n{font-size:16px;font-weight:700;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.cal .d.sat .n{color:#3568B5}.cal .d.sun .n,.cal .d.hol .n{color:#C64B3C}
.cal .d.today{background:#FFF3CF;box-shadow:inset 0 0 0 2px var(--accent)}.cal .d.today .n{background:var(--accent);color:#fff!important}
.cal .d.closed{background:var(--bg)}
.cal .d.sel{outline:3px solid var(--accent);outline-offset:1px}
.cal .d .cnt{font-size:13px;color:var(--muted);font-weight:700}
.cal .d .names{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal .nm{font-size:13px;line-height:1.3;padding:1px 5px;border-radius:4px;background:var(--chip);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .nm.me{font-weight:900;box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent-ink)}
.cal .nm.pend{background:transparent;box-shadow:inset 0 0 0 2px var(--warn);color:var(--warn)}
.cal .d.mine{background:var(--accent-tint)}
.cal .d .chk{font-size:14px;font-weight:900;color:#fff;background:var(--accent);border-radius:999px;padding:2px 8px}
.people{display:flex;flex-direction:column;gap:6px}
.people .pr{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-size:18px}
.people .pr .tm{color:var(--muted);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:118px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.st:active{transform:scale(.985)}
.st .nm{font-family:var(--f-disp);font-size:24px;font-weight:700;line-height:1.2}
.st .sc{font-size:13px;color:var(--muted)}
.st .pill{align-self:flex-start;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--muted)}
.st.in{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.st.in .pill{background:var(--ok-soft);color:var(--ok)}
.st.done .pill{background:var(--accent-soft);color:var(--accent-ink)}
.st.nopin .pill{background:var(--warn-soft);color:var(--warn)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.foot a{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.card h2{font-size:20px;margin-bottom:6px}
.note{font-size:14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:999px;padding:12px 24px;font-weight:700;cursor:pointer;min-height:52px;font-size:18px}
.btn.ghost{background:transparent;color:var(--accent-ink);border-color:var(--line)}
.btn.big{min-height:84px;font-size:28px;letter-spacing:.14em;border-radius:20px;width:100%}
.btn.out{background:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.setup input{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:24px;letter-spacing:.12em;text-transform:uppercase;background:var(--bg);min-height:60px;text-align:center;font-family:ui-monospace,Menlo,monospace}
.err{color:var(--ng);font-size:15px;min-height:1.4em}
/* モーダル */
.ov{position:fixed;inset:0;background:rgba(10,20,18,.5);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.md{background:var(--panel);border-radius:22px;box-shadow:var(--shadow);width:100%;max-width:560px;max-height:96vh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.md .who{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.md .who b{font-family:var(--f-disp);font-size:30px}
.md .who span{font-size:14px;color:var(--muted)}
.pinbox{display:flex;justify-content:center;gap:14px;margin:4px 0}
.pinbox i{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);display:inline-block}
.pinbox i.on{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{border:1px solid var(--line);background:var(--bg);border-radius:14px;min-height:64px;font-size:26px;font-weight:700;cursor:pointer}
.pad button.fn{font-size:16px;font-weight:500;color:var(--muted)}
.pad button:active{background:var(--accent-soft)}
.brk{display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px}
.brk input{width:90px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);text-align:center;font-size:20px;min-height:48px}
.md .row{display:flex;gap:10px}
.ext{display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:14px;padding:12px 14px}
.ext .lb{font-size:15px;font-weight:700}
.cnt{display:flex;align-items:center;justify-content:center;gap:14px}
.cnt button{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:34px;font-weight:700;cursor:pointer;color:var(--ink)}
.cnt b{font-family:var(--f-disp);font-size:44px;min-width:80px;text-align:center;font-variant-numeric:tabular-nums}
.dh{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:18px;font-weight:700;cursor:pointer;color:var(--ink)}
.dh.on{background:#EFDDF0;color:#7E3F7A;border-color:#7E3F7A}
.arow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:17px;font-weight:700;padding:6px 0;border-bottom:1px solid var(--line)}.arow small{display:block;font-weight:400;font-size:12px;opacity:.7}
.cnt.sm button{width:50px;height:50px;font-size:28px}.cnt.sm b{font-size:30px;min-width:52px}
.al{min-height:52px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:17px;font-weight:700;cursor:pointer;color:var(--ink);width:100%}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:22px 34px;border-radius:20px;font-size:26px;font-family:var(--f-disp);font-weight:700;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;text-align:center;max-width:90vw}
.toast.on{opacity:1}
.toast.ok{background:var(--ok)}.toast.ng{background:var(--ng)}
.toast small{display:block;font-size:15px;font-weight:400;opacity:.9;margin-top:4px}
@media (max-width:600px){.clock .t{font-size:44px}.brand h1{font-size:20px}.grid{grid-template-columns:repeat(2,1fr)}.st .nm{font-size:20px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card"><h2>読み込み中…</h2></div></div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   ★ 設定：index.html と同じ Apps Script の URL
   ============================================================ */
const CONFIG = { apiUrl: "https://script.google.com/macros/s/AKfycbzhQBkdaln_Rsxx_GCO5MnYtuQq0N1VmV7wZz_CaP-AhtT_Z5LhJJZyknqsc39sRpw/exec" };
const KEY_LS = "rinoa-kiosk-key";
const WD = ["日","月","火","水","木","金","土"];
const pad = n => String(n).padStart(2,"0");
const dropZero = hm => String(hm||"").replace(/^0/,"");
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let toastT; function toast(msg,cls,sub){ const t=$("#toast"); t.className="toast on "+(cls||""); t.innerHTML=esc(msg)+(sub?`<small>${esc(sub)}</small>`:""); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),3200); }

const S = { key:null, data:null, error:null, modal:null, pin:"", busy:false, lastFetch:0, unlinkUI:false, tab:"tc", ym:null, selDay:null, wish:null };
/* ---------- 日付（シフト表・希望用） ---------- */
const bizNow=()=>new Date(Date.now()-6*3600e3);
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const BIZ_TODAY=ymd(bizNow()), BIZ_YM=BIZ_TODAY.slice(0,7);
const daysIn=(y,m)=>new Date(y,m,0).getDate(), dow=(y,m,d)=>new Date(y,m-1,d).getDay();
const holCache={};
function holidays(y){ if(holCache[y]) return holCache[y]; const set=new Set(), add=(m,d)=>set.add(`${m}-${d}`);
  [[1,1],[2,11],[2,23],[4,29],[5,3],[5,4],[5,5],[8,11],[11,3],[11,23]].forEach(([m,d])=>add(m,d));
  const nthMon=(m,n)=>{ const f=new Date(y,m-1,1).getDay(); return 1+((8-f)%7)+(n-1)*7; }; add(1,nthMon(1,2)); add(7,nthMon(7,3)); add(9,nthMon(9,3)); add(10,nthMon(10,2));
  add(3,Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4))); add(9,Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4)));
  [...set].forEach(k=>{ const [m,d]=k.split("-").map(Number); const dt=new Date(y,m-1,d); if(dt.getDay()===0){ let n=new Date(dt); do{ n.setDate(n.getDate()+1);}while(set.has(`${n.getMonth()+1}-${n.getDate()}`)); if(n.getFullYear()===y) add(n.getMonth()+1,n.getDate()); }});
  for(let m=1;m<=12;m++) for(let d=2;d<daysIn(y,m);d++){ const dt=new Date(y,m-1,d); if(dt.getDay()===0||set.has(`${m}-${d}`)) continue; if(set.has(`${m}-${d-1}`)&&set.has(`${m}-${d+1}`)) add(m,d); }
  holCache[y]=set; return set; }
const isHol=(y,m,d)=>holidays(y).has(`${m}-${d}`);
const isClosed=(y,m,d)=>{ const st=S.data.settings; return (st.closed||[]).includes(dow(y,m,d)) || (st.closedHol!==false && isHol(y,m,d)); };
const cellBase=v=>String(v||"").split("|")[0];
function cellTimes(v){ const b=cellBase(v), st=S.data.settings; if(!b||b==="OFF") return null; if(b.startsWith("C:")){ const [a,c]=b.slice(2).split("-"); return {s:a,e:c,cus:true}; } return {s:st.openStart,e:st.openEnd,cus:false}; }
const monthLabel=ym=>{ const [y,m]=ym.split("-").map(Number); return `${y}年${m}月`; };
try{ S.key=localStorage.getItem(KEY_LS)||null; }catch(e){}

async function api(action,data,key){
  const res=await fetch(CONFIG.apiUrl,{method:"POST",body:JSON.stringify({action,deviceKey:key||S.key,data:data||{}})});
  const j=await res.json().catch(()=>({ok:false,error:"bad_response"}));
  if(!j.ok) throw new Error(j.error||"error");
  return j;
}
const ERR={closed:"受付が締め切られています",no_record:"記録がありません",undo_expired:"取り消せるのは打刻から15分以内です",not_out:"退勤はまだ押されていません",already_out:"退勤済みのため出勤は取り消せません",bad_device:"端末コードが違うか、無効になっています",pin_not_set:"暗証番号が未設定です。自分のLINEのアプリ「タイムカード」で設定してください",bad_pin:"暗証番号が違います",already_in:"すでに出勤しています",not_in:"出勤が押されていません",bad_response:"通信に失敗しました",unknown_action:"サーバーがまだ新しくなっていません（経営者に伝えてください）"};
const errMsg=e=>ERR[String(e&&e.message||e)]||("エラー："+String(e&&e.message||e));
// 手当のボタン（ボトル手当・シャンパン/ワイン手当・同伴手当・ゴルフ同伴手当）。サーバーが対応していて、使いはじめる月（標準 2026-12）になったら出す
const ALLOW_KINDS=[["bottle","ボトル手当"],["champ","シャンパン・ワイン手当"],["douhan","同伴手当"],["golf","ゴルフ同伴手当"]];
const allowOn=()=>{ const st=S.data&&S.data.settings; if(!st||!st.allow||typeof st.allow!=="object") return false; const d=new Date(Date.now()-6*3600e3); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`>=(st.allowFrom||"2026-12"); };
const allowTxt=a=>ALLOW_KINDS.filter(([k])=>+(a||{})[k]>0).map(([k,l])=>l+(a[k]>1?`${a[k]}回`:"")).join("・");

async function load(){
  if(!S.key){ S.data=null; render(); return; }
  try{ S.data=await api("kioskBootstrap",{}); S.error=null; S.lastFetch=Date.now(); }
  catch(e){ if(String(e.message)==="bad_device"){ S.key=null; try{localStorage.removeItem(KEY_LS);}catch(x){} S.error="端末コードが無効になりました。もう一度入力してください。"; } else S.error=errMsg(e); }
  render();
}
function schedText(cell){
  if(!cell) return ""; const base=String(cell).split("|")[0]; const st=S.data.settings;
  if(base==="OFF") return "本日は休みの予定";
  if(base.startsWith("C:")){ const [a,b]=base.slice(2).split("-"); return `予定 ${dropZero(a)}〜${dropZero(b)}`; }
  return `予定 ${dropZero(st.openStart)}〜${dropZero(st.openEnd)}`;
}
function render(){
  const now=new Date();
  if(!S.key||!S.data){
    app.innerHTML=`<div class="card setup" style="max-width:560px;margin:8vh auto 0;width:100%">
      <h2>店舗端末の登録</h2><p class="note">経営者が管理画面の「設定」→「店舗端末（iPad）」で発行した<b>端末コード</b>を入れてください。この端末は打刻専用になり、LINEや管理画面にはつながりません。</p>
      <form id="setup" style="display:flex;flex-direction:column;gap:12px;margin-top:10px"><input id="key" placeholder="RINOA-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false"><div class="err" id="err">${esc(S.error||"")}</div><button class="btn" ${S.busy?"disabled":""}>この端末を登録する</button></form>
    </div>`;
    $("#setup").onsubmit=async e=>{ e.preventDefault(); const k=$("#key").value.trim().toUpperCase(); if(!k) return; S.busy=true; render(); try{ await api("kioskBootstrap",{},k); S.key=k; try{localStorage.setItem(KEY_LS,k);}catch(x){} S.error=null; await load(); }catch(err){ S.error=errMsg(err); } S.busy=false; render(); };
    return;
  }
  const D=S.data, st=D.today.status;
  const cards=D.staff.map(s=>{ const x=st[s.id]||{}; const cls= x.out?"done": x.in?"in": (D.settings.kioskPin&&!s.hasPin?"nopin":"");
    const pill= x.out?`退勤済 ${dropZero(x.in)}〜${dropZero(x.out)}`: x.in?`出勤中 ${dropZero(x.in)}〜`: (D.settings.kioskPin&&!s.hasPin?"暗証番号 未設定":"未出勤");
    return `<button class="st ${cls}" data-id="${esc(s.id)}"><span class="nm">${esc(s.name)}</span><span class="pill">${esc(pill)}</span><span class="sc">${esc(schedText(x.sched))}</span></button>`; }).join("");
  if(!S.ym||!D.months||!D.months[S.ym]) S.ym=BIZ_YM;
  const tabTitle={tc:"タイムカード",shift:"シフト表",wish:"出勤申請"}[S.tab];
  const tabSub={tc:"自分の名前をタップ → 暗証番号 → 出勤／退勤",shift:"日をタップすると、その日に入る人が見られます",wish:"自分の名前をタップ → 暗証番号 → 入れる日をタップ → 送信"}[S.tab];
  const body= S.tab==="shift"?shiftBody(D) : S.tab==="wish"?wishBody(D) : `<div class="grid">${cards||'<div class="note">スタッフが登録されていません。各自のLINEから名前を登録してもらってください。</div>'}</div>
    <div class="legend"><span><i style="background:var(--ok)"></i>出勤中</span><span><i style="background:var(--accent-soft)"></i>退勤済み</span><span><i style="background:var(--warn-soft)"></i>暗証番号が未設定（本人のLINEで設定、または経営者が設定）</span></div>`;
  app.innerHTML=`<header class="hdr"><div class="brand"><div class="eyebrow">${esc(D.settings.eyebrow||"TIME CARD")}</div><h1>${esc(D.settings.name)}　${tabTitle}</h1><div class="sub">${tabSub}</div></div>

      else if(type==="undoIn") S.data.today.status[s.id]={...st,in:"",out:"",brk:0};
      setTimeout(load,3000); S.modal=null; S.pin="";
      toast(type==="undoIn"?`${s.name} さん　出勤を取り消しました`:type==="undoOut"?`${s.name} さん　退勤を取り消しました`:`${s.name} さん　${type==="in"?"出勤":"退勤"}しました`,"ok",type.startsWith("undo")?"修正として記録しました":`${dropZero(r.serverTime.slice(11))}　${type==="in"?"いってらっしゃい"+(ex.douhan?"（同伴）":""):"お疲れさまでした"}${type==="out"?[drinkStep?`ドリンク${ex.drinks}杯`:"",ex.douhan?"同伴":""].filter(Boolean).map((t,i,a)=>(i?"":"（")+t+(i===a.length-1?"）":"・")).join(""):""}`); }
    catch(e){ toast(errMsg(e),"ng"); S.pin=""; }
    S.busy=false; render();
  };
  const un=$("#undo"); if(un) un.onclick=()=>doPunch(un.dataset.type,un);
  const alBtn=$("#alBtn"); if(alBtn) alBtn.onclick=async()=>{   // 暗証番号を確かめてから、手当の回数の画面へ
    const D=S.data, s=D.staff.find(x=>x.id===S.modal.id), x=D.today.status[s.id]||{};
    if(D.settings.kioskPin && S.pin.length<4){ toast("暗証番号を入力してください","ng"); return; }
    S.busy=true; alBtn.disabled=true; alBtn.textContent="確認中…";
    try{ await api("kioskCheck",{staffId:s.id,pin:S.pin}); S.modal.step="allow"; S.modal.allow={...(x.allow||{})}; clearTimeout(idleT); idleT=setTimeout(()=>{S.modal=null;render();},90000); }
    catch(e){ toast(errMsg(e),"ng"); S.pin=""; }
    S.busy=false; render();
  };
  document.querySelectorAll("[data-ak]").forEach(b=>b.onclick=()=>{ const k=b.dataset.ak; S.modal.allow[k]=Math.max(0,Math.min(99,(+S.modal.allow[k]||0)+(+b.dataset.n))); $("#al_"+k).textContent=S.modal.allow[k]; clearTimeout(idleT); idleT=setTimeout(()=>{S.modal=null;render();},90000); });
  const alSave=$("#alSave"); if(alSave) alSave.onclick=async()=>{
    const D=S.data, s=D.staff.find(x=>x.id===S.modal.id);
    S.busy=true; alSave.disabled=true;
    try{ const r=await api("kioskAllow",{staffId:s.id,pin:S.pin,allow:S.modal.allow}); S.data.today=r.today; const t=allowTxt((r.today.status[s.id]||{}).allow); S.modal=null; S.pin=""; toast(`${s.name} さん　手当を記録しました`,"ok",t||"手当なし"); setTimeout(load,3000); }
    catch(e){ toast(errMsg(e),"ng"); S.pin=""; }
    S.busy=false; render();
  };
  const bump=n=>{ S.modal.drinks=Math.max(0,Math.min(99,S.modal.drinks+n)); $("#drN").textContent=S.modal.drinks; clearTimeout(idleT); idleT=setTimeout(()=>{S.modal=null;render();},45000); };
  if($("#drM")){ $("#drM").onclick=()=>bump(-1); $("#drP").onclick=()=>bump(1); }
  if($("#dhT")){ $("#dhT").onclick=()=>{ S.modal.douhan=!S.modal.douhan; const b=$("#dhT"); b.classList.toggle("on",S.modal.douhan); b.textContent=S.modal.douhan?"✓ 今日は同伴あり":"同伴なし（あればタップ）"; }; }
  const go=$("#go"); if(go) go.onclick=async()=>{
    const D=S.data, s=D.staff.find(x=>x.id===S.modal.id), x=D.today.status[s.id]||{}, type=x.in?"out":"in";
    if(type==="out"&&S.modal.step!=="drinks"){   // 暗証番号を確かめてから、設定された人にだけ杯数を聞く
      if(D.settings.kioskPin && S.pin.length<4){ toast("暗証番号を入力してください","ng"); return; }
      S.busy=true; go.disabled=true; go.textContent="確認中…"; const brk=+($("#brk")?.value||0);
      try{ const c=await api("kioskCheck",{staffId:s.id,pin:S.pin}); S.modal.brk=brk; S.busy=false;
        if(c.drinkOn){ S.modal.step="drinks"; clearTimeout(idleT); idleT=setTimeout(()=>{S.modal=null;render();},45000); render(); return; } }
      catch(e){ S.busy=false; toast(errMsg(e),"ng"); S.pin=""; render(); return; }
    }
    await doPunch(type,go);
  };
}
setInterval(()=>{ const el=$("#clk"); if(el){ const n=new Date(); el.textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`; } },1000);
setInterval(()=>{ if(S.key && !S.modal && Date.now()-S.lastFetch>60000) load(); },15000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && S.key) load(); });
load();
</script>
</body>
</html>
