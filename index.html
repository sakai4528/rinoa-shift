<div class="app" id="app"><div class="loading"><b>読み込み中…</b>LINEの情報を確認しています</div></div>

<script>
/* ============================================================
   ★ 設定：ここだけ書き換える（README 参照）
   ============================================================ */
const CONFIG = {
  liffId: "2012191949-slfaXSbA",                 // LINE Developers の LIFF ID（例 2001234567-AbCdEfGh）
  apiUrl: "https://script.google.com/macros/s/AKfycbzhQBkdaln_Rsxx_GCO5MnYtuQq0N1VmV7wZz_CaP-AhtT_Z5LhJJZyknqsc39sRpw/exec"           // Apps Script のウェブアプリ URL（…/exec）
};

/* ============================================================
   共通
   ============================================================ */
const SERVER_VERSION="2026-10-26.3";   // Apps Script 側の VERSION と一致していれば再デプロイ済み
const TC_MODES={nearest:"四捨五入（15分未満は切り捨て、15分以上は30分扱い）",floor:"すべて切り捨て",ceil:"すべて切り上げ",favor:"出勤は切り上げ・退勤は切り捨て"};
const WD = ["日","月","火","水","木","金","土"];
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const ymOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const parseYM = s => { const [y,m]=s.split("-").map(Number); return {y,m}; };
const daysIn = (y,m) => new Date(y,m,0).getDate();
const addMonth = (ym,n) => { const {y,m}=parseYM(ym); return ymOf(new Date(y,m-1+n,1)); };
const dow = (y,m,d) => new Date(y,m-1,d).getDay();
const TODAY = ymd(new Date());
const THIS_YM = ymOf(new Date());

const holCache = {};
function holidays(y){
  if(holCache[y]) return holCache[y];
  const set = new Set(); const add=(m,d)=>set.add(`${m}-${d}`);
  [[1,1],[2,11],[2,23],[4,29],[5,3],[5,4],[5,5],[8,11],[11,3],[11,23]].forEach(([m,d])=>add(m,d));
  const nthMon=(m,n)=>{ const first=new Date(y,m-1,1).getDay(); return 1+((8-first)%7)+(n-1)*7; };
  add(1,nthMon(1,2)); add(7,nthMon(7,3)); add(9,nthMon(9,3)); add(10,nthMon(10,2));
  add(3,Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4)));
  add(9,Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4)));
  [...set].forEach(k=>{ const [m,d]=k.split("-").map(Number); const dt=new Date(y,m-1,d); if(dt.getDay()===0){ let n=new Date(dt); do{ n.setDate(n.getDate()+1);}while(set.has(`${n.getMonth()+1}-${n.getDate()}`)); if(n.getFullYear()===y) add(n.getMonth()+1,n.getDate()); }});
  for(let m=1;m<=12;m++){ for(let d=2;d<daysIn(y,m);d++){ const dt=new Date(y,m-1,d); if(dt.getDay()===0||set.has(`${m}-${d}`)) continue; if(set.has(`${m}-${d-1}`)&&set.has(`${m}-${d+1}`)) add(m,d); } }
  holCache[y]=set; return set;
}
const isHol=(y,m,d)=>holidays(y).has(`${m}-${d}`);
const isClosedDay=(y,m,d)=>{ const S=Store.settings; return (S.closed||[]).includes(dow(y,m,d)) || (S.closedHol!==false && isHol(y,m,d)); };

function hoursOf(s,e,brk){ const [sh,sm]=s.split(":").map(Number),[eh,em]=e.split(":").map(Number); let min=(eh*60+em)-(sh*60+sm); if(min<0) min+=24*60; return Math.max(0,(min-(brk||0))/60); }
const fmtH = h => (Math.round(h*10)/10).toLocaleString("ja-JP",{maximumFractionDigits:1});
const dropZero = hm => String(hm||"").replace(/^0/,"");
const baseOf = val => String(val||"").split("|")[0];
function tagsOf(val){ const f=String(val||"").split("|")[1]||""; return {douhan:f.includes("d"),early:f.includes("h")}; }
function withTags(base,tags){ const f=(tags?.douhan?"d":"")+(tags?.early?"h":""); return f?`${base}|${f}`:base; }
function cellInfo(val,S){
  if(!val) return null;
  const base=baseOf(val), tags=tagsOf(val);
  if(base==="OFF") return {kind:"off",label:"休",hours:0,tags};
  if(base.startsWith("C:")){ const [s,e]=base.slice(2).split("-"); return {kind:"custom",label:`${dropZero(s)}〜${dropZero(e)}`,start:s,end:e,hours:hoursOf(s,e,0),tags}; }
  return {kind:"on",label:"出勤",start:S.openStart,end:S.openEnd,hours:hoursOf(S.openStart,S.openEnd,0),tags};
}
const tagLabel = tags => [tags?.douhan?"同伴":"",tags?.early?"早上がり":""].filter(Boolean).join("・");
const tagCls = tags => (tags?.douhan?" dh":"")+(tags?.early?" ea":"");
const minOf = hm => { const [h,m]=hm.split(":").map(Number); return h*60+m; };
const hmOf = min => { min=((min%1440)+1440)%1440; return `${pad(Math.floor(min/60))}:${pad(min%60)}`; };
function roundPunch(hm,kind){
  const S=Store.settings, u=+S.tcUnit||30, mode=S.tcMode||"nearest", m=minOf(hm); let r;
  if(mode==="floor") r=Math.floor(m/u)*u; else if(mode==="ceil") r=Math.ceil(m/u)*u;
  else if(mode==="favor") r= kind==="in"?Math.ceil(m/u)*u:Math.floor(m/u)*u;
  else r=Math.round(m/u)*u;
  return hmOf(r);
}
function calcRec(rec){
  if(!rec||!rec.in) return null;
  const inR=roundPunch(rec.in.slice(11,16),"in");
  if(!rec.out) return {inR,open:true,mins:0};
  const outR=roundPunch(rec.out.slice(11,16),"out");
  const dayDiff=Math.round((new Date(rec.out.slice(0,10)+"T00:00")-new Date(rec.in.slice(0,10)+"T00:00"))/86400000);
  let mins=minOf(outR)-minOf(inR)+dayDiff*1440;
  if(rec.out.slice(11,16)<rec.in.slice(11,16)&&dayDiff===0) mins+=1440;
  mins-=(+rec.brk||0);
  return {inR,outR,mins:Math.max(0,mins),open:false};
}
function dayCounts(ym){
  const {y,m}=parseYM(ym), S=Store.settings, sh=Store.shiftOf(ym), list=activeStaff(), out={};
  for(let d=1;d<=daysIn(y,m);d++){
    const w=dow(y,m,d), closed=isClosedDay(y,m,d), req=closed?0:((S.required||[])[w]??0), on=[], off=[], undecided=[];
    list.forEach(s=>{ const v=sh.cells[`${d}_${s.id}`], info=cellInfo(v,S); if(info&&info.kind!=="off") on.push({s,info}); else if(info) off.push({s,info}); else undecided.push({s,info:null}); });
    out[d]={total:on.length,req,closed,on,off,undecided,short:!closed&&on.length<req,over:!closed&&req>0&&on.length>req};
  }
  return out;
}

const Store = {
  token:null, profile:null, me:null, isAdmin:false, liffUrl:"", serverVersion:"", devices:[],
  settings:{name:"シフト表",eyebrow:"",deadlineDay:20,openStart:"11:00",openEnd:"18:00",required:[2,2,2,2,2,3,3],closed:[],closedHol:true,tcUnit:30,tcMode:"nearest"},
  staff:[], months:{}, loading:{}, listeners:[], ready:false, error:null, lastFetch:0, pendingSaves:0,
  on(fn){ this.listeners.push(fn); }, emit(){ this.listeners.forEach(f=>f()); },
  async init(){
    if(!CONFIG.liffId || CONFIG.liffId.includes("HERE") || !CONFIG.apiUrl || CONFIG.apiUrl.includes("HERE")){ this.error="設定が未入力です（index.html の CONFIG に LIFF ID と API の URL を入れてください）"; this.emit(); return; }
    try{
      await liff.init({liffId:CONFIG.liffId});
      if(!liff.isLoggedIn()){ liff.login({redirectUri:location.href}); return; }
      this.token=liff.getAccessToken();
    }catch(e){ this.error="LINEの確認に失敗しました。LINEアプリからもう一度開いてください。（"+(e.message||e)+"）"; this.emit(); return; }
    await this.bootstrap();
  },
  async api(action,data){
    const res=await fetch(CONFIG.apiUrl,{method:"POST",body:JSON.stringify({action,accessToken:this.token,data:data||{}})});
    const j=await res.json().catch(()=>({ok:false,error:"bad_response"}));
    if(!j.ok){ if(j.error==="unauthorized"){ try{ liff.logout(); }catch(e){} liff.login({redirectUri:location.href}); } throw new Error(j.error||"error"); }
    return j;
  },
  wantMonths(){ const s=new Set([state.month,THIS_YM,addMonth(THIS_YM,-1),state.wishMonth,state.tcMonth]); return [...s]; },
  async bootstrap(){
    try{
      const j=await this.api("bootstrap",{months:this.wantMonths()});
      this.profile=j.profile; this.serverVersion=j.version||""; this.devices=j.devices||[]; this.settings={...this.settings,...j.settings}; this.staff=j.staff; this.me=j.me; this.isAdmin=j.isAdmin; this.liffUrl=j.liffUrl||"";
      Object.assign(this.months,j.months); this.ready=true; this.error=null; this.lastFetch=Date.now();
    }catch(e){ this.error="データを読み込めませんでした。電波の良いところでもう一度開いてください。（"+(e.message||e)+"）"; }
    this.emit();
  },
  async refresh(){ if(!this.ready) return this.bootstrap(); try{ const j=await this.api("getMonths",{months:Object.keys(this.months).concat(this.wantMonths())}); Object.assign(this.months,j.months); const b=await this.api("bootstrap",{months:[]}); this.settings={...this.settings,...b.settings}; this.staff=b.staff; this.me=b.me; this.isAdmin=b.isAdmin; this.lastFetch=Date.now(); }catch(e){} this.emit(); },
  subscribeMonth(ym){ if(!this.ready||this.months[ym]||this.loading[ym]) return; this.loading[ym]=true; this.api("getMonths",{months:[ym]}).then(j=>{ Object.assign(this.months,j.months); }).catch(()=>{}).finally(()=>{ delete this.loading[ym]; this.emit(); }); },
  monthData(ym){ return this.months[ym]||{shift:null,wishes:{},timecards:{}}; },
  wishesOf(ym){ return this.monthData(ym).wishes||{}; },
  shiftOf(ym){ return this.monthData(ym).shift||{month:ym,status:"collecting",cells:{}}; },
  tcOf(ym){ return this.monthData(ym).timecards||{}; },
  setMonthPart(ym,part,val){ this.months[ym]=this.months[ym]||{shift:null,wishes:{},timecards:{}}; this.months[ym][part]=val; },
  /* --- 書き込み --- */
  async register(name){ const j=await this.api("register",{name}); this.me=j.me; this.staff=j.staff; this.emit(); },
  async saveWish(w){ const j=await this.api("saveWish",w); const ws={...this.wishesOf(w.month)}; ws[j.wish.staffId]=j.wish; this.setMonthPart(w.month,"wishes",ws); this.emit(); },
  async setPin(pin){ const j=await this.api("setPin",{pin}); this.me=j.me; this.emit(); },
  async resetPin(staffId,pin){ const j=await this.api("resetPin",{staffId,pin:pin||""}); this.staff=j.staff; this.emit(); },
  async createDevice(name){ const j=await this.api("createDevice",{name}); this.devices=j.devices; this.emit(); },
  async deleteDevice(id){ const j=await this.api("deleteDevice",{id}); this.devices=j.devices; this.emit(); },
  async punch(data){ const j=await this.api("punch",data); const tc={...this.tcOf(j.timecard.month)}; tc[j.timecard.staffId]=j.timecard; this.setMonthPart(j.timecard.month,"timecards",tc); this.emit(); return j; },
  async adminLogin(pin){ const j=await this.api("adminLogin",{pin}); this.isAdmin=!!j.isAdmin; await this.bootstrap(); },
  async saveSettings(patch){ this.settings={...this.settings,...patch}; this.emit(); const j=await this.api("saveSettings",{settings:patch}); this.settings={...this.settings,...j.settings}; this.emit(); },
  async upsertStaff(s){ const j=await this.api("upsertStaff",{staff:s}); this.staff=j.staff; this.emit(); },
  async deleteStaff(id){ const j=await this.api("deleteStaff",{id}); this.staff=j.staff; this.emit(); },
  saveTimer:null, dirtyShift:null,
  // シフトのマスは画面上ですぐ反映し、まとめて保存（連続タップでも1回ずつ待たせない）
  setShiftLocal(doc){ this.setMonthPart(doc.month,"shift",doc); this.dirtyShift=doc; clearTimeout(this.saveTimer); this.pendingSaves++; this.emit(); this.saveTimer=setTimeout(()=>this.flushShift(),900); },
  async flushShift(){ const doc=this.dirtyShift; if(!doc) return; this.dirtyShift=null; try{ const j=await this.api("saveShift",{month:doc.month,status:doc.status,cells:doc.cells}); if(!this.dirtyShift) this.setMonthPart(doc.month,"shift",j.shift); }catch(e){ toast("保存できませんでした。通信を確認してください"); } this.pendingSaves=0; this.emit(); },
  async saveShiftNow(doc){ clearTimeout(this.saveTimer); this.dirtyShift=null; this.setMonthPart(doc.month,"shift",doc); this.pendingSaves++; this.emit(); const j=await this.api("saveShift",{month:doc.month,status:doc.status,cells:doc.cells}); this.setMonthPart(doc.month,"shift",j.shift); this.pendingSaves=0; this.emit(); return j.shift; },
  async saveTC(doc){ const j=await this.api("saveTimecard",doc); const tc={...this.tcOf(doc.month)}; tc[doc.staffId]=j.timecard; this.setMonthPart(doc.month,"timecards",tc); this.emit(); }
};

function vMonthCal(ym, opts){

function vWish(m){

/* ============================================================
   操作
   ============================================================ */
function go(){ render(); }
function setMonth(n){ state.month=addMonth(state.month,n); state.selDay=null; state.sheetDay=null; state.lineText=null; go(); }
function writeCells(mut){ const sh={...Store.shiftOf(state.month)}; sh.cells={...sh.cells}; mut(sh.cells); Store.setShiftLocal(sh); }
async function busy(fn){ if(state.busy) return; state.busy=true; go(); try{ await fn(); }catch(e){ toast(errMsg(e)); } state.busy=false; go(); }
function errMsg(e){ const m=String(e&&e.message||e); return ({closed:"受付は締め切られています",forbidden:"この操作は管理者のみです",not_registered:"先に名前を登録してください",already_in:"すでに出勤しています",not_in:"出勤が押されていません",bad_pin:"暗証番号が違います",bad_pin_format:"暗証番号は4〜6桁の数字にしてください",phone_punch_disabled:"出勤・退勤は店内のiPadで押してください",pin_not_set:"先に暗証番号を設定してください",bad_staff:"スタッフが見つかりません"})[m]||("エラー："+m); }

app.addEventListener("click", async e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  if(t.dataset.act==="closeSheet" && t.closest("[data-stop]") && t.tagName!=="BUTTON") return;
  const act=t.dataset.act, S=Store.settings;
  if(t.tagName==="A") e.preventDefault();
  switch(act){
    case "refresh": toast("更新しています…"); await Store.refresh(); toast("最新の状態です"); break;
    case "toggleRole": state.role = state.role==="admin"?"staff":"admin"; state.selDay=null; state.sheetDay=null; go(); break;
    case "exitProxy": state.proxyId=null; state.draftWish=null; state.tab="wish"; go(); break;
    case "tab": state.tab=t.dataset.v; state.selDay=null; go(); break;
    case "atab": state.atab=t.dataset.v; state.sheetDay=null; state.lineText=null; go(); break;
    case "pm": setMonth(+t.dataset.n); break;
    case "wm": state.wishMonth=addMonth(state.wishMonth,+t.dataset.n); state.selDay=null; state.draftWish=null; go(); break;
    case "tcm": state.tcMonth=addMonth(state.tcMonth,+t.dataset.n); go(); break;
    case "selDay": state.selDay = state.selDay===+t.dataset.d?null:+t.dataset.d; go(); break;
    case "openDay": state.sheetDay=+t.dataset.d; go(); break;
    case "closeSheet": state.sheetDay=null; go(); break;
    case "sheetMove": { const {y,m}=parseYM(state.month); const nd=state.sheetDay+(+t.dataset.n); if(nd<1||nd>daysIn(y,m)) break; state.sheetDay=nd; go(); break; }
    case "dset": { const d=state.sheetDay, sid=t.dataset.s, v=t.dataset.v; writeCells(c=>{ const k=`${d}_${sid}`; if(!v) delete c[k]; else if(v==="OFF") c[k]="OFF"; else c[k]=withTags(v,tagsOf(c[k])); }); break; }
    case "dtag": { const d=state.sheetDay, sid=t.dataset.s, tg=t.dataset.t; writeCells(c=>{ const k=`${d}_${sid}`, cur=c[k]; if(!cur||baseOf(cur)==="OFF") return; const tags=tagsOf(cur); if(tg==="d") tags.douhan=!tags.douhan; else tags.early=!tags.early; c[k]=withTags(baseOf(cur),tags); }); break; }
    case "dayAll": { const d=state.sheetDay, v=t.dataset.v; writeCells(c=>{ activeStaff().forEach(s=>{ if(v) c[`${d}_${s.id}`]=v; else delete c[`${d}_${s.id}`]; }); }); break; }
    case "viewAs": state.proxyId=t.dataset.id; state.role="staff"; state.tab="wish"; state.draftWish=null; go(); toast(`${Store.staff.find(s=>s.id===t.dataset.id)?.name||""}さんとして入力中（代理）`); break;
    case "wishDay": { const d=+t.dataset.d, W=state.draftWish, cur=W.days[d]?.t; if(cur!=="o"&&cur!=="p") W.days[d]={t:"o"}; else if(cur==="o") W.days[d]={t:"p",from:Store.settings.openStart||"10:00",to:Store.settings.openEnd||"15:00"}; else delete W.days[d]; state.selDay=d; state.draftDirty=true; go(); break; }
    case "sendWish": await busy(async()=>{ const W=state.draftWish; W.memo=$("#wMemo")?.value||""; await Store.saveWish({month:W.month,staffId:W.staffId,days:W.days,memo:W.memo}); state.draftDirty=false; toast("希望を送信しました"); }); break;
    case "status": await busy(async()=>{ const sh={...Store.shiftOf(state.month)}; sh.cells={...sh.cells}; sh.status=t.dataset.v; await Store.saveShiftNow(sh); toast({published:"シフトを公開し、スタッフにLINEで通知しました",editing:"受付を締め切りました",collecting:"希望受付を再開しました"}[sh.status]); }); break;
    case "applyWish": { const wishes=Store.wishesOf(state.month), {y,m}=parseYM(state.month); let n=0,off=0; writeCells(c=>{ activeStaff().forEach(s=>{ const wdoc=wishes[s.id]; if(!wdoc) return; const days=wdoc.days||{}; for(let d=1;d<=daysIn(y,m);d++){ const k=`${d}_${s.id}`; if(c[k]) continue; const v=days[d]; if(isClosedDay(y,m,d)){ c[k]="OFF"; continue; } if(v?.t==="o"){ c[k]="ON"; n++; } else if(v?.t==="p"&&v.from&&v.to){ c[k]=(v.from===S.openStart&&v.to===S.openEnd)?"ON":`C:${v.from}-${v.to}`; n++; } else { c[k]="OFF"; off++; } } }); }); toast(`提出済みの希望を反映：出勤 ${n}マス・休 ${off}マス（未提出の人は変えていません）`); break; }
    case "fillDefault": { const {y,m}=parseYM(state.month); let n=0; writeCells(c=>{ activeStaff().forEach(s=>{ for(let d=1;d<=daysIn(y,m);d++){ const k=`${d}_${s.id}`; if(!c[k]){ c[k]= isClosedDay(y,m,d)?"OFF":"ON"; n++; } } }); }); toast(`${n}マスを埋めました（定休日・祝日は休）`); break; }
    case "clearMonth": { if(t.dataset.sure!=="1"){ t.dataset.sure="1"; t.textContent="本当にクリアする（もう一度タップ）"; t.classList.add("danger"); break; }
      await busy(async()=>{ const sh={...Store.shiftOf(state.month)}; sh.cells={}; if(sh.status==="published") sh.status="editing"; await Store.saveShiftNow(sh); toast("クリアしました"); }); break; }
    case "lineText": state.lineText=buildLineText(); go(); break;
    case "tcText": state.lineText=buildTcText(); go(); break;
    case "closeLine": state.lineText=null; go(); break;
    case "copyLine": { const txt=state.lineText||""; try{ await navigator.clipboard.writeText(txt); toast("コピーしました。LINEに貼り付けてください"); }catch(err){ const el=$("#lineTxt"); if(el){ const r=document.createRange(); r.selectNodeContents(el); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast("長押しでコピーしてください"); } break; }
    case "delDevice": { if(t.dataset.sure!=="1"){ t.dataset.sure="1"; t.textContent="本当に無効にする（もう一度タップ）"; break; } await busy(async()=>{ await Store.deleteDevice(t.dataset.id); toast("端末コードを無効にしました"); }); break; }
    case "editStaff": state.editStaff=Store.staff.find(s=>s.id===t.dataset.id)||null; go(); $("#sName")?.focus(); break;
    case "cancelEdit": state.editStaff=null; go(); break;
    case "delStaff": { if(t.dataset.sure!=="1"){ t.dataset.sure="1"; t.textContent="本当に削除（もう一度タップ）"; break; } await busy(async()=>{ await Store.deleteStaff(t.dataset.id); state.editStaff=null; toast("削除しました"); }); break; }
    case "punchIn": await busy(async()=>{ await Store.punch({type:"in"}); toast("出勤を記録しました"); }); break;
    case "punchOut": await busy(async()=>{ await Store.punch({type:"out",brk:Math.max(0,+($("#tcBrk")?.value||0))}); toast("退勤を記録しました。お疲れさまでした"); }); break;
    case "fixOpen": await busy(async()=>{ const hm=$("#openOut")?.value; if(!hm) throw new Error("退勤時刻を入れてください"); await Store.punch({type:"fixOut",month:t.dataset.ym,day:+t.dataset.d,hm}); toast("退勤を登録しました（手入力）"); }); break;
    case "tcStaff": state.tcStaff = state.tcStaff===t.dataset.id?null:t.dataset.id; state.lineText=null; go(); if(state.tcStaff) $("#tcdetail")?.scrollIntoView({behavior:"smooth",block:"start"}); break;
    case "tcSave": case "tcAdd": case "tcDel": await busy(async()=>{
      const sid=state.tcStaff, ym=state.month; if(!sid) return;
      const doc={month:ym,staffId:sid,days:{...((Store.tcOf(ym)[sid]||{}).days||{})}};
      Object.keys(doc.days).forEach(d=>{ const i=$(`#ti${d}`)?.value, o=$(`#to${d}`)?.value, b=$(`#tb${d}`)?.value; if(i===undefined) return; const r={...doc.days[d]}; const date=`${ym}-${pad(+d)}`; const prevIn=r.in, prevOut=r.out;
        if(i) r.in=date+"T"+i; if(o) r.out=(r.out?r.out.slice(0,10):date)+"T"+o; else delete r.out; r.brk=Math.max(0,+b||0); if(r.in!==prevIn||r.out!==prevOut) r.editedBy="owner"; doc.days[d]=r; });
      if(act==="tcDel") delete doc.days[t.dataset.d];
      if(act==="tcAdd"){ const d=+$("#tcNewDay").value, i=$("#tcNewIn").value, o=$("#tcNewOut").value, b=+$("#tcNewBrk").value||0; if(!d||!i) throw new Error("日と出勤時刻を入れてください"); const date=`${ym}-${pad(d)}`; doc.days[d]={in:date+"T"+i,...(o?{out:date+"T"+o}:{}),brk:b,manual:true,editedBy:"owner"}; }
      await Store.saveTC(doc); toast(act==="tcDel"?"削除しました":act==="tcAdd"?"追加しました":"保存しました"); }); break;
  }
});
app.addEventListener("change", e=>{
  const t=e.target;
  if(t.dataset.wt){ const d=+t.dataset.d, W=state.draftWish; if(W.days[d]?.t==="p"){ W.days[d][t.dataset.wt]=t.value; state.draftDirty=true; go(); } return; }
  const sid=t.dataset.tin||t.dataset.tout;
  if(sid && state.sheetDay){ const s=$(`#tin_${sid}`)?.value, en=$(`#tout_${sid}`)?.value, S=Store.settings; if(!s||!en) return; const d=state.sheetDay;
    writeCells(c=>{ const k=`${d}_${sid}`; c[k] = withTags((s===S.openStart&&en===S.openEnd) ? "ON" : `C:${s}-${en}`, tagsOf(c[k])); }); }
});
app.addEventListener("input", e=>{ if(e.target.id==="wMemo"){ state.draftWish.memo=e.target.value; state.draftDirty=true; } });
app.addEventListener("submit", async e=>{
  e.preventDefault(); const f=e.target, fd=new FormData(f), S=Store.settings;
  if(f.id==="regf"){ const name=(fd.get("name")||"").trim(); if(!name){ $("#regerr").textContent="お名前を入れてください"; return; } await busy(async()=>{ await Store.register(name); toast(`${name}さん、登録しました`); }); }
  if(f.id==="pinset"){ const pin=String(fd.get("pin")||"").trim(); if(!/^\d{4,6}$/.test(pin)){ toast("暗証番号は4〜6桁の数字にしてください"); return; } await busy(async()=>{ await Store.setPin(pin); toast("暗証番号を設定しました。店舗iPadで使えます"); }); }
  if(f.id==="devf"){ const name=String(fd.get("name")||"").trim()||"店舗iPad"; await busy(async()=>{ await Store.createDevice(name); toast("端末コードを発行しました"); }); }
  if(f.id==="pinf"){ await busy(async()=>{ await Store.adminLogin(String(fd.get("pin")||"")); state.role="admin"; toast("管理者として登録しました"); }); }
  if(f.id==="stf"){
    const id=fd.get("id")||("s_"+Date.now().toString(36)); const prev=Store.staff.find(s=>s.id===id)||{};
    const s={id,name:(fd.get("name")||"").trim(),short:(fd.get("short")||"").trim(),emp:fd.get("emp")||"",order:+fd.get("order")||99,active:!!fd.get("active"),note:fd.get("note")||""};
    const newpin=String(fd.get("newpin")||"").trim();
    if(!s.name) return; await busy(async()=>{ await Store.upsertStaff(s); if(newpin){ if(!/^\d{4,6}$/.test(newpin)) throw new Error("bad_pin_format"); await Store.resetPin(s.id,newpin); } state.editStaff=null; toast(prev.id?"保存しました":"追加しました"); });
  }
  if(f.id==="setf"){
    const required=WD.map((_,i)=>+fd.get("req"+i)||0), closed=WD.map((_,i)=>fd.get("closed"+i)?i:-1).filter(i=>i>=0);
    const patch={name:(fd.get("name")||"").trim()||S.name,eyebrow:fd.get("eyebrow")||"",openStart:fd.get("openStart")||S.openStart,openEnd:fd.get("openEnd")||S.openEnd,deadlineDay:Math.min(28,Math.max(1,+fd.get("deadlineDay")||20)),required,closed,closedHol:!!fd.get("closedHol"),tcUnit:+fd.get("tcUnit")||30,tcMode:TC_MODES[fd.get("tcMode")]?fd.get("tcMode"):"nearest",notifyWish:!!fd.get("notifyWish"),phonePunch:!!fd.get("phonePunch"),kioskPin:!!fd.get("kioskPin")};
    const pin=String(fd.get("pin")||"").trim(); if(pin) patch.pin=pin;
    await busy(async()=>{ await Store.saveSettings(patch); toast("設定を保存しました"); });
  }
});
function buildLineText(){
  const ym=state.month, {y,m}=parseYM(ym), S=Store.settings, sh=Store.shiftOf(ym), DC=dayCounts(ym), lines=[`【${S.name} ${m}月シフト】${sh.status==="published"?"":"（仮）"}　標準 ${dropZero(S.openStart)}〜${dropZero(S.openEnd)}`];
  for(let d=1;d<=daysIn(y,m);d++){
    const w=dow(y,m,d), c=DC[d]; if(c.closed){ lines.push(`${m}/${d}(${WD[w]}${isHol(y,m,d)?"祝":""}) 定休`); continue; }
    const names=c.on.map(r=>{ const ex=[r.info.kind==="custom"?`${dropZero(r.info.start)}-${dropZero(r.info.end)}`:"",tagLabel(r.info.tags)].filter(Boolean).join("・"); return r.s.name+(ex?`(${ex})`:""); });
    lines.push(`${m}/${d}(${WD[w]}${isHol(y,m,d)?"祝":""}) ${names.length?names.join("・")+`（${names.length}人）`:"出勤者なし"}`);
  }
  return lines.join("\n");
}
function buildTcText(){
  const ym=state.month, {y,m}=parseYM(ym), tcs=Store.tcOf(ym), S=Store.settings, lines=[`【${S.name} ${y}年${m}月 勤務時間】${+S.tcUnit||30}分刻み／${TC_MODES[S.tcMode||"nearest"]}`];
  activeStaff().forEach(s=>{ const doc=tcs[s.id]; if(!doc) return; let tot=0; const ds=Object.keys(doc.days||{}).map(Number).sort((a,b)=>a-b); lines.push(`■ ${s.name}`);
    ds.forEach(d=>{ const r=doc.days[d], c=calcRec(r); if(!c) return; if(c.open){ lines.push(`${m}/${d}(${WD[dow(y,m,d)]}) ${dropZero(c.inR)}〜 退勤未`); return; } tot+=c.mins; lines.push(`${m}/${d}(${WD[dow(y,m,d)]}) ${dropZero(c.inR)}〜${dropZero(c.outR)}${r.brk?` 休憩${r.brk}分`:""} ${fmtH(c.mins/60)}h${r.manual?" ※手入力":""}`); });
    lines.push(`合計 ${fmtH(tot/60)}h`); });
  return lines.join("\n");
}

/* ============================================================
   起動
   ============================================================ */
Store.on(()=>render());
Store.init().then(()=>{ if(Store.isAdmin && !Store.me) state.role="admin"; render(); });
setInterval(()=>{ const el=$("#clock"); if(el){ const n=new Date(); el.textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}`; } },15000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && Store.ready && Date.now()-Store.lastFetch>60000) Store.refresh(); });
window.addEventListener("beforeunload",()=>{ if(Store.dirtyShift) Store.flushShift(); });
</script>
